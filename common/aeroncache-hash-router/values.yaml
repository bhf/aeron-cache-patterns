# aeroncache-hash-router — a single Ingress that routes by a HASH of the cache id to one of N
# per-shard gateways. Where common/aeroncache-router renders one static path rule per cache id (an
# explicit id -> instance map), this chart computes the shard at request time inside ingress-nginx:
#
#     shard = crc32(cacheId) % shardCount   ->   proxy to "<readRelease>-<shard>"
#
# so EVERY cache id routes deterministically to exactly one shard with no per-id configuration, and
# all operations for the same id (create/put/get) land on the same gateway + backend. It is a
# first-party chart (like common/observability); nothing here builds or vendors an image — the Ingress
# is served by an ingress-nginx controller that common/ingress.sh installs.
#
# The hashing lives in an nginx `server-snippet`, so the controller must allow snippet annotations:
#   common/ingress.sh allow-snippets   (sets allow-snippet-annotations + annotations-risk-level)

# Which interface this front door routes for: http | sse | ws. Drives the routed path shapes that
# carry the cache id (http: /api/v1/cache/<id>; sse: /api/sse/v1/cache/[hydrate/]<id>; ws:
# /api/ws/v1/cache/<id>) and the per-location tuning (sse needs buffering off; ws needs the upgrade +
# a long read timeout). For sse/ws the read path hits the sse/ws gateway and writes are routed to the
# http writer on the SAME shard (readRelease/writeRelease below).
interface: http

# Namespace the gateway Services live in. The Ingress and its backends share this release's namespace;
# it is interpolated into the in-cluster Service DNS the snippet proxies to.
namespace: aeroncache-patterns

# IngressClass of the installed controller. common/ingress.sh installs ingress-nginx, whose class is
# "nginx".
ingressClassName: nginx

# Optional Host for the Ingress rule. Empty = a host-less rule that matches any Host header, which is
# what the port-forward-based verify uses. Set a host for a name-based deployment.
host: ""

# Release-name stem + Service port of the per-shard gateways that SERVE each routed cache id (the
# "read" path). Shard s is served by Service "<readRelease>-<s>" on <readPort>:
#   http -> aeroncache-http:7070   sse -> aeroncache-sse:7072   ws -> aeroncache-ws:7071
readRelease: aeroncache-http
readPort: 7070

# Release-name stem + Service port of the per-shard gateway that accepts WRITES for each routed cache
# id. SSE and WS are read-only on the routed path, so their writes hash to the http writer that shares
# the backend (aeroncache-http-<shard>:7070). For the http interface writes == reads, so these are
# unused (the single http location serves both).
writeRelease: aeroncache-http
writePort: 7070

# Fan-out aggregator (multi-cache UI). OFF by default, so the routing-hash-* patterns render exactly
# as before. When enabled (interface must be http), the snippet splits the UI's single API base in
# two: the cross-cache AGGREGATE endpoints (/api/v1/caches, /stats, /snapshot[-info|-and-purge],
# /counters-*, /timers, /aeron-counters, /shutdown and /multi/*) are proxied to the stateless
# aeroncache-http-fanout aggregator, which scatter-gathers them across every gateway; the KEYED
# per-cache operations (/api/v1/cache/<id>... and /api/v1/counters/<id>...) still hash on the cache id
# to the owning shard. This lets the multi-cache UI point one AERON_CACHE_API at this Ingress and get
# both behaviours. See the multi-cache-ui pattern.
fanout:
  enabled: false
  # Release name (Service) of the fan-out aggregator in this namespace, and its HTTP port.
  release: aeroncache-http-fanout
  port: 7071

# Number of shards. MUST equal the number of gateways the pattern deployed (aeroncache-http-0 ..
# aeroncache-http-<shardCount-1>); the snippet computes crc32(cacheId) % shardCount, so a mismatch
# would route to a Service that does not exist. Changing this remaps most cache ids (plain mod-N, not
# a consistent hash) — fine for a fixed-topology demo.
shardCount: 3

# DNS resolver the snippet uses to resolve the chosen gateway at request time. A variable proxy_pass
# (the shard is only known per-request) is resolved dynamically, so nginx needs a resolver. This is
# the cluster DNS (CoreDNS) Service ClusterIP — the pattern discovers it at deploy time
# (kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}') and overrides this. The
# default is the common default Service CIDR address for kube-dns.
resolver: "10.96.0.10"

# Extra annotations merged onto the Ingress (after the generated ones).
extraAnnotations: {}

# Extra labels merged onto the Ingress.
extraLabels: {}
