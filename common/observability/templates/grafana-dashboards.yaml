apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aeroncache-observability.grafana.fullname" . }}-dashboards
  labels:
    {{- include "aeroncache-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  # Dashboards are supplied by the caller via .Values.grafana.dashboards (a map of name -> JSON).
  # Each pattern injects its own with `--set-file grafana.dashboards.<pattern>=dashboards/<pattern>.json`
  # (see common/pattern.mk), so the panels are pattern-specific while the stack stays shared. When no
  # dashboard is provided the folder is simply empty.
  {{- range $name, $json := .Values.grafana.dashboards }}
  {{ $name }}.json: |
{{ $json | indent 4 }}
  {{- end }}
