apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aeroncache-ws-keyed-router.fullname" . }}
  labels:
    {{- include "aeroncache-ws-keyed-router.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # The keyed/whole-cache split is decided from the `keys` query parameter inside this snippet, which
    # adds one regex location that proxies to the chosen gateway. Requires the controller to allow
    # snippet annotations (common/ingress.sh allow-snippets); without it the controller drops this and
    # all traffic falls through to the default backend below.
    nginx.ingress.kubernetes.io/server-snippet: |
      {{- include "aeroncache-ws-keyed-router.serverSnippet" . | nindent 6 }}
    {{- with .Values.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    {{- /* Default backend for unmatched paths (e.g. health): the stream gateway Service. The keyed
          server-snippet location wins for the subscribe routes. */}}
    {{- if .Values.host }}
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.stream.service }}
                port:
                  number: {{ .Values.stream.port }}
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.stream.service }}
                port:
                  number: {{ .Values.stream.port }}
    {{- end }}
