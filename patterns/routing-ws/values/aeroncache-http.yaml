# Overlay for every http writer in this pattern (the ws subscribe route is read-only, so each instance
# runs an http writer alongside its ws reader). Image comes from versions.env via the Makefile
# (ghcr_image); cacheMode / clusterAddresses / ephemeral endpoints and the per-instance release name
# are set per instance in the Makefile. ClusterIP so the Ingress and the verify can reach each writer.
service:
  type: ClusterIP
