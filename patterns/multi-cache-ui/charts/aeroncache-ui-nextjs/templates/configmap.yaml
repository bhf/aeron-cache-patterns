apiVersion: v1
kind: ConfigMap
metadata:
  name: aeroncache-ui-config
  namespace: {{ .Values.namespace }}
data:
  AERON_CACHE_API: {{ .Values.endpoints.api | quote }}
  {{- /* LOCAL PATCH (multi-cache-ui): expose AERON_CACHE_MULTI so the UI uses the fan-out
         /api/v1/multi/... endpoints and renders one snapshot result per backend. Upstream's chart
         does not template this key yet. Set .Values.endpoints.multi=true to turn it on; absent/false
         keeps the default single-backend behaviour, so other users of this chart are unaffected. */}}
  {{- if .Values.endpoints.multi }}
  AERON_CACHE_MULTI: {{ .Values.endpoints.multi | quote }}
  {{- end }}
  AERON_CACHE_WS_API: {{ .Values.endpoints.ws | quote }}
  AERON_CACHE_SSE_API: {{ .Values.endpoints.sse | quote }}
  JAEGER: {{ .Values.endpoints.jaeger | quote }}
  PROMETHEUS: {{ .Values.endpoints.prometheus | quote }}
  {{ printf "environments/configmap.%s.yaml" .Values.env | .Files.Get | indent 2 }}
