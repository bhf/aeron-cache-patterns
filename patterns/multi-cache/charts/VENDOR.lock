# LOCAL PATCHES (this pattern only) — NOT upstream. Re-running sync-charts.sh WILL overwrite these;
# re-apply them after a refresh. They exist because this pattern runs several cache instances in one
# namespace, which the singleton charts don't support out of the box. Each edit is marked in-place
# with a "multi-cache edit:" comment. See README.md ("How it works").
#   aeroncache-cluster, aeroncache-ephemeral:
#     - templates/configmap.yaml: ConfigMap metadata.name now reads .Values.aeroncacheClusterConfigmap
#       (was a hardcoded literal) so each release owns its own config.
#     - templates/configmap.yaml: CLUSTER_ADDRESSES is derived from the release's own fullname +
#       replicaCount (was a fixed 3-node list keyed to the single "aeroncache-cluster" name).
#     - values.yaml: fullnameOverride and serviceAccount.name blanked so names derive from the
#       (per-instance) release name.
#     - templates/secrets.yaml: Secret metadata.name now derives from the fullname (was hardcoded).
#   aeroncache-http:
#     - templates/configmap.yaml: ConfigMap metadata.name now reads .Values.aeroncacheHTTPConfigmap.
#     - values.yaml: fullnameOverride and serviceAccount.name blanked.
