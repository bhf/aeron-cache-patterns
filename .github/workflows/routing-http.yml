name: Routing HTTP

# Runs the routing-http pattern against both backend types (clustered + ephemeral) via the reusable
# workflow. Two independent caches sit behind one Ingress; prereqs.sh installs the ingress-nginx
# controller, then `make verify` proves requests are routed to the owning gateway by cache id (with an
# isolation check). Fires on changes to this pattern, the shared router chart / ingress installer, the
# shared pieces, or the reusable workflow.
on:
  push:
    branches: [main]
    paths:
      - 'patterns/routing-http/**'
      - 'common/**'
      - 'versions.env'
      - '.github/workflows/routing-http.yml'
      - '.github/workflows/_pattern-ci.yml'
  pull_request:
    paths:
      - 'patterns/routing-http/**'
      - 'common/**'
      - 'versions.env'
      - '.github/workflows/routing-http.yml'
      - '.github/workflows/_pattern-ci.yml'

jobs:
  routing-http:
    strategy:
      fail-fast: false
      matrix:
        cache-type: [clustered, ephemeral]
    uses: ./.github/workflows/_pattern-ci.yml
    with:
      pattern: routing-http
      cache-type: ${{ matrix.cache-type }}
      # Two clustered backends + gateways + the ingress controller; give the namespace room to go Ready.
      wait-timeout: "600s"
