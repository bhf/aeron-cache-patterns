name: Docs build

# Build-only for now (no deploy). Catches breakage in the docs-site or in a pattern's
# README.md / meta.yaml, since the site renders those at build time. Cloudflare Pages
# deployment will be added later.
on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'patterns/**'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'patterns/**'
      - '.github/workflows/docs-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
