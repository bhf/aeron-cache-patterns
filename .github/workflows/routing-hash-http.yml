name: Routing Hash HTTP

# Runs the routing-hash-http pattern against both backend types (clustered + ephemeral) via the
# reusable workflow. N cache shards sit behind one Ingress whose server-snippet hashes the cache id to
# a shard; prereqs.sh installs the ingress-nginx controller AND enables snippet annotations, then
# `make verify` proves requests are hashed to the owning gateway deterministically (with landing,
# isolation and crc32 cross-checks). Fires on changes to this pattern, the shared hash-router chart /
# ingress installer, the shared pieces, or the reusable workflow.
on:
  push:
    branches: [main]
    paths:
      - 'patterns/routing-hash-http/**'
      - 'common/**'
      - 'versions.env'
      - '.github/workflows/routing-hash-http.yml'
      - '.github/workflows/_pattern-ci.yml'
  pull_request:
    paths:
      - 'patterns/routing-hash-http/**'
      - 'common/**'
      - 'versions.env'
      - '.github/workflows/routing-hash-http.yml'
      - '.github/workflows/_pattern-ci.yml'

jobs:
  routing-hash-http:
    strategy:
      fail-fast: false
      matrix:
        cache-type: [clustered, ephemeral]
    uses: ./.github/workflows/_pattern-ci.yml
    with:
      pattern: routing-hash-http
      cache-type: ${{ matrix.cache-type }}
      # Three clustered backends + gateways + the ingress controller; give the namespace room to go Ready.
      wait-timeout: "900s"
